name: Freshness

# Daily live checks of the light-wallet servers. Any change to the facts becomes
# a pull request for a person to review. Requires "Allow GitHub Actions to create
# and approve pull requests" under Settings > Actions > General.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run freshness
      - run: npm run build:llms
      - name: Propose the updated facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data docs; then
            echo "Facts unchanged."
            exit 0
          fi
          branch="freshness/$(date -u +%Y-%m-%d)"
          git config user.name "zcash-now freshness"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data docs
          git commit -m "Refresh facts from live checks"
          git push --force origin "$branch"
          gh pr create --head "$branch" \
            --title "Refresh facts $(date -u +%Y-%m-%d)" \
            --body "Automated live checks of the light-wallet servers. Review the changed facts before merging." \
            || echo "A pull request for $branch already exists."
